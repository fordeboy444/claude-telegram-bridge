# Local LiteLLM proxy for Claude Code in relay-code-pi-development.
# Project-local only: .claude/litellm/ is gitignored. Never commit or ship this file.
# The Vertex SA JSON is referenced by path ONLY - never inline, log, or print its private_key.

model_list:
  # opus / sonnet / fable -> gemini-3.8-flash (speed-first all-Flash)
  - model_name: gemini-3.8-flash
    litellm_params:
      model: vertex_ai/gemini-3.8-flash
      vertex_project: automatic-bond-507214-q4
      vertex_location: global
      vertex_credentials: C:/Users/taro8/Documents/automatic-bond-507214-q4-509313207459.json
      timeout: 300
      num_retries: 2
      # thinking: { type: "disabled" } drops the 50+ reasoning tokens on every turn for instantaneous first-token response
      thinking:
        type: "disabled"

  # haiku -> gemini-3.5-flash-lite (background/cheap tier, ~0.7s latency)
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: vertex_ai/gemini-3.5-flash-lite
      vertex_project: automatic-bond-507214-q4
      vertex_location: global
      vertex_credentials: C:/Users/taro8/Documents/automatic-bond-507214-q4-509313207459.json
      timeout: 300
      num_retries: 2

  # -------------------------------------------------------------
  # Ollama Cloud Models (routed via local Ollama daemon on 11434)
  # -------------------------------------------------------------
  - model_name: glm-5.3:cloud
    litellm_params:
      model: openai/glm-5.3:cloud
      api_base: http://localhost:11434/v1
      api_key: ollama

  - model_name: glm-5.3-flash:cloud
