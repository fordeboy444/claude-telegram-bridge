litellm_settings:
  # Claude Code sends Anthropic-only params (cache_control, beta headers, ...).
  # Drop what Gemini/Vertex/Ollama does not accept instead of failing the request.
  drop_params: true

general_settings:
  # Literal local key is fine: gitignored dir, bound to 127.0.0.1.
  # Must equal ANTHROPIC_AUTH_TOKEN in .claude/settings.local.json.
